<!DOCTYPE html>
<html><head><title>pieFI Admin Login</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{font-family:sans-serif;background:#0a3d62;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.login{background:#fff;color:#333;padding:30px;border-radius:10px;width:300px;text-align:center}
input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:10px;background:#f39c12;border:none;color:#fff;font-weight:bold;border-radius:5px;cursor:pointer}</style>
</head><body>
<div class="login">
    <h2>pieFI Admin</h2>
    {% if error %}<p style="color:red;font-size:14px;">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text" name="u" placeholder="Username" required>
        <input type="password" name="p" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p style="font-size:12px;color:#888;margin-top:15px;">Default: admin / admin</p>
</div>
</body></html>
