name: Build pieFI OS v1 (x86_64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: git clone --depth 1 -b v23.05.5 https://git.openwrt.org/openwrt/openwrt.git

      - name: Copy custom packages
        run: |
          cp -r package/pisowifi openwrt/package/
          cp -r package/piefi-branding openwrt/package/

      - name: Apply config
        run: |
          cp configs/x86_64.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download sources
        run: cd openwrt && make download -j8

      - name: Build firmware
        run: cd openwrt && make -j$(nproc) V=s 2>&1 | tail -300

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: piefi-OS-v1-x86-firmware
          path: openwrt/bin/targets/x86/64/*.img.gz
          retention-days: 30
